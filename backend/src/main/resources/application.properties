spring.application.name=dvc-backend
server.port=8080
management.endpoints.web.exposure.include=health,info

# Set DB_USERNAME and DB_PASSWORD in the process environment before starting the app.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dvc?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Local development seeds demo accounts. Set spring.profiles.active=prod in a deployed environment.
spring.profiles.default=demo
dvc.demo.admin.email=${DVC_DEMO_ADMIN_EMAIL:admin@gmail.com}
dvc.demo.admin.password=${DVC_DEMO_ADMIN_PASSWORD:Admin@12345}
dvc.demo.volunteer.email=${DVC_DEMO_VOLUNTEER_EMAIL:volunteer@gmail.com}
dvc.demo.volunteer.password=${DVC_DEMO_VOLUNTEER_PASSWORD:Volunteer@12345}
dvc.demo.user.email=${DVC_DEMO_USER_EMAIL:user@gmail.com}
dvc.demo.user.password=${DVC_DEMO_USER_PASSWORD:User@12345}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
